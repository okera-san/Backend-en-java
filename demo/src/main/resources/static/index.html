<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Alumnos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">Registro de Alumnos</h2>

        <!-- formulario -->
        <form id="formAlumno" class="card p-4 shadow needs-validation" novalidate>
            <input type="hidden" id="idAlumno">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Nombre</label>
                    <input type="text" id="nombre" class="form-control" required minlength="2" maxlength="12">
                    <div class="invalid-feedback">
                        Ingresa un nombre válido.
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Apellido</label>
                    <input type="text" id="apellido" class="form-control" required minlength="2" maxlength="12">
                </div>

                <div class="col-md-6 mb-3">
                    <label>Teléfono</label>
                    <input type="tel" id="telefono" class="form-control" required minlength="8" maxlength="9"
                        pattern="^[0-9]{8}$" title="Ingresa 8 dígitos, con o sin guion (ej: 12345678 o 1234-5678)">
                    <div class="invalid-feedback">
                        Ingresa un numero válido.
                    </div>
                </div>

                <div class="col-md-6 mb-3">
                    <label>Dirección</label>
                    <input type="text" id="direccion" class="form-control" required minlength="4" maxlength="20">
                </div>

            </div>

            <button class="btn btn-outline-primary" type="submit" id="btnGuardar">Guardar</button>
            <button class="btn btn-outline-success d-none" type="button" id="btnActualizar">Actualizar</button>
            <button class="btn btn-outline-secondary d-none" type="button" id="btnCancelar">Cancelar</button>
        </form>

        <!-- tabla -->
        <h3 class="text-center mt-5">Listado de Alumnos</h3>

        <table class="table table-striped mt-3">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Teléfono</th>
                    <th>Dirección</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaBody"></tbody>
        </table>
    </div>

    <script>
        // URL API Backend
        const API = "/alumnos";

        // cargar alumnos
        async function cargarAlumnos() {
            try {
                const res = await fetch(API);
                const alumnos = await res.json();

                let html = "";
                alumnos.forEach(a => {
                    html += `
                        <tr>
                            <td>${a.id}</td>
                            <td>${a.nombre}</td>
                            <td>${a.apellido}</td>
                            <td>${a.telefono}</td>
                            <td>${a.direccion}</td>
                            <td>
                                <button class="btn btn-outline-warning btn-sm"
                                onclick="editar(${a.id}, '${a.nombre}', '${a.apellido}', '${a.telefono}', '${a.direccion}')"> 
                                Editar
                                </button>
                                <button class="btn btn-danger btn-sm"
                                onclick="eliminarAlumno(${a.id})"> 
                                Eliminar
                                </button>
                            </td>
                        </tr>
                    `;
                });

                document.getElementById("tablaBody").innerHTML = html;
            }
            catch (error) {
                console.error("Error cargando alumnos:", error);
            }
        }
        cargarAlumnos();


        const form = document.getElementById("formAlumno");

        // guardar alumno
        document.getElementById("formAlumno").addEventListener("submit", async (e) => {
            e.preventDefault();

            if (!form.checkValidity()) {
                form.classList.add("was-validated");
                return;
            }

            const data = {
                nombre: nombre.value.trim(),
                apellido: apellido.value.trim(),
                telefono: telefono.value.trim(),
                direccion: direccion.value.trim(),
            };

            const res = await fetch(API, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            if(!res.ok) {
                const errorData = await res.json().catch(() => ({}));
                alert(errorData.error || "Error al guardar");
                return;
            }

            await cargarAlumnos();
            form.reset();
            form.classList.remove("was-validated");
        })

        // eliminar alumno
        async function eliminarAlumno(id) {
            // await fetch("http://localhost:3000/alumnos/1")
            await fetch(`${API}/${id}`, { method: "DELETE" });
            cargarAlumnos();
        }

        // activar modo edicion
        function editar(id, nombreVal, apellidoVal, telefonoVal, direccionVal) {
            idAlumno.value = id;
            nombre.value = nombreVal;
            apellido.value = apellidoVal;
            telefono.value = telefonoVal;
            direccion.value = direccionVal;

            btnGuardar.classList.add("d-none");
            btnActualizar.classList.remove("d-none");
            btnCancelar.classList.remove("d-none");
        }

        // actualizar alumno
        btnActualizar.addEventListener("click", async () => {

            if (!form.checkValidity()) {
                form.classList.add("was-validated");
                return;
            }

            const data = {
                nombre: nombre.value.trim(),
                apellido: apellido.value.trim(),
                telefono: telefono.value.trim(),
                direccion: direccion.value.trim(),
            };

            const id = idAlumno.value;

            const res = await fetch(`${API}/${id}`,
                {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({}));
                    alert(errorData.error  || "Error al actualizar");
                    return;
                }

            await cargarAlumnos();

            form.reset();
            form.classList.remove("was-validated");
            btnGuardar.classList.remove("d-none");
            btnActualizar.classList.add("d-none");
            btnCancelar.classList.add("d-none");
        })

        // cancelar edicion
        btnCancelar.addEventListener("click", () => {
            formAlumno.reset()

            btnGuardar.classList.remove("d-none");
            btnActualizar.classList.add("d-none");
            btnCancelar.classList.add("d-none");
        })
    </script>

</body>

</html>
